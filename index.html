<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />

    <!-- viewport-fit=cover: под вырез iPhone, иначе контент
         прячется под чёлкой при установке на домашний экран. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>GLAMOUR</title>
    <meta
      name="description"
      content="Programare online la salon: alege serviciul, maestrul și ora potrivită."
    />

    <!-- Цвет строки состояния при установке. -->
    <meta name="theme-color" content="#100b0b" />

    <!-- Установка на домашний экран. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GLAMOUR" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
