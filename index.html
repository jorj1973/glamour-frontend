<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />

    <!-- viewport-fit=cover: под вырез iPhone, иначе контент
         прячется под чёлкой при установке на домашний экран. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!--meta-->
    <title>GLAMOUR</title>
    <meta
      name="description"
      content="Programare online la salon: alege serviciul, maestrul și ora potrivită."
    />

    <!--
      Что покажет WhatsApp, когда мастер кинет ссылку клиентке.

      Всё, что стоит между метками meta, — общие слова про площадку.
      Они видны на любой странице, кроме витрин: для витрины сервер
      заменяет этот кусок целиком, подставив название салона или имя
      мастера, описание и картинку.

      Метки удалять нельзя. Без них подстановка молча перестанет
      работать: страница откроется, а предпросмотр снова станет
      пустым, и заметить это можно будет только в переписке.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GLAMOUR" />
    <meta property="og:title" content="GLAMOUR" />
    <meta
      property="og:description"
      content="Programare online la salon: alege serviciul, maestrul și ora potrivită."
    />
    <meta property="og:image" content="https://glamourapp.md/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--/meta-->

    <!-- Цвет строки состояния при установке. -->
    <meta name="theme-color" content="#17151c" />

    <!-- Установка на домашний экран. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GLAMOUR" />
  </head>
  <body>
    <script>
      /*
        Старые адреса переводим в новые до запуска приложения.

        Визитки напечатаны, письма разосланы, ссылки лежат в чужих
        переписках — ломать их нельзя. Но и держать витрины в хеше
        нельзя: всё, что после решётки, браузер серверу не посылает, и
        для поисковика сотня витрин — одна страница.

        Поэтому #salon/glamour тихо становится /salon/glamour в самом
        начале, без перезагрузки и без мигания. Человек разницы не
        заметит, поисковик увидит настоящий адрес.
      */
      (function () {
        if (window.location.pathname !== '/') {
          return;
        }

        var hash = window.location.hash;
        var shop = hash.match(/^#(salon|master)\/([^/?#]+)(.*)$/);

        if (shop) {
          history.replaceState(null, '', '/' + shop[1] + '/' + shop[2] + shop[3]);
          return;
        }

        if (hash === '#try' || hash.indexOf('#try?') === 0) {
          history.replaceState(null, '', '/try' + hash.slice(4));
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
